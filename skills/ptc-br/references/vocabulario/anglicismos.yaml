# Vocabulário controlado PTC-BR — verbos aportuguesados do inglês (spec 0.4.0)
#
# Política de anglicismos:
#   - substantivos técnicos consolidados (commit, branch, pipeline) são aprovados nos glossários de domínio,
#     sem itálico e com gênero registrado (references/glossarios/);
#   - verbos aportuguesados (commitar, deployar, setar) são não preferidos: use o verbo em português
#     ou "fazer + substantivo" (fazer commit, fazer merge).
# Faixa de ID: V-0800..0899.

- id: V-0800
  lema: commitar
  classe: verbo
  status: nao_preferido
  preferir: [fazer commit, registrar]
  significado_aprovado: gravar alterações no repositório
  exemplo_correto: Faça commit das alterações.
  exemplo_incorreto: Commite as alterações.
  versao_inclusao: 0.4.0

- id: V-0801
  lema: deployar
  classe: verbo
  status: nao_preferido
  preferir: [publicar, implantar, fazer deploy]
  significado_aprovado: publicar uma versão em um ambiente
  formas: [deployar, deploya, deployam, deploye, deployem, deployou, deployado, deployada, deployando, deployará, deploiar, deploia, deploie, deploiou, deploiado, deploiando]
  exemplo_correto: Publique a versão em homologação.
  exemplo_incorreto: Deploye a versão em homologação.
  versao_inclusao: 0.4.0

