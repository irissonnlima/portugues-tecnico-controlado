# Vocabulário controlado PTC-BR — geral (spec 0.2.0)
#
# Fonte editável. Depois de alterar, compile:
#     python3 tools/compilar_vocabulario.py
# O compilador valida contra schema.json e gera skills/ptc-br/scripts/vocabulario.json.
#
# Faixas de ID (estáveis, nunca reutilizadas):
#   V-0001..0099  verbos de instrução aprovados
#   V-0100..0199  verbos e locuções não preferidos
#   V-0200..0299  conectivos não preferidos
#   V-0300..0399  padrões (construções)
#   V-0400..0499  palavras com mais de um sentido técnico
#
# Status em_analise = decisão pendente do time; gera alerta de confiança baixa.

# ------------------------------------------------------------ verbos de instrução aprovados

- id: V-0001
  lema: verificar
  classe: verbo
  status: aprovado
  significado_aprovado: examinar um estado ou resultado para determinar se atende a um critério
  preferida_em_instrucoes: verifique
  exemplo_correto: Verifique a versão do certificado.
  exemplo_incorreto: Realize a verificação da versão do certificado.
  versao_inclusao: 0.1.0

- id: V-0002
  lema: validar
  classe: verbo
  status: aprovado
  significado_aprovado: confirmar, por regra ou ferramenta, que um dado atende a um formato ou a uma especificação
  motivo: Não é sinônimo de verificar. Validar aplica uma regra formal; verificar examina um estado.
  exemplo_correto: O sistema valida o CPF antes de gravar o cadastro.
  versao_inclusao: 0.2.0

- id: V-0003
  lema: confirmar
  classe: verbo
  status: aprovado
  significado_aprovado: aceitar uma ação proposta pelo sistema, ou declarar que um fato é verdadeiro
  preferida_em_instrucoes: confirme
  versao_inclusao: 0.2.0

- id: V-0004
  lema: selecionar
  classe: verbo
  status: aprovado
  significado_aprovado: escolher um item em uma interface
  preferida_em_instrucoes: selecione
  versao_inclusao: 0.2.0

- id: V-0005
  lema: executar
  classe: verbo
  status: aprovado
  significado_aprovado: iniciar e completar a execução de um programa, comando ou procedimento
  preferida_em_instrucoes: execute
  versao_inclusao: 0.2.0

- id: V-0006
  lema: iniciar
  classe: verbo
  status: aprovado
  significado_aprovado: pôr em funcionamento um serviço, processo ou etapa
  preferida_em_instrucoes: inicie
  versao_inclusao: 0.1.0

- id: V-0007
  lema: terminar
  classe: verbo
  status: aprovado
  significado_aprovado: chegar ao fim de uma execução ou etapa
  motivo: Para um processo interrompido de propósito, use parar ou encerrar.
  versao_inclusao: 0.1.0

- id: V-0008
  lema: usar
  classe: verbo
  status: aprovado
  significado_aprovado: empregar um recurso, ferramenta ou método
  preferida_em_instrucoes: use
  versao_inclusao: 0.1.0

