# ------------------------------------------------------------ padrões

- id: V-0300
  lema: o mesmo (pronome)
  classe: padrao
  status: nao_preferido
  regra: PTC-07
  preferir: [repita o substantivo, ele, ela]
  significado_aprovado: —
  padrao: "(?<!é )(?<!são )(?<!era )(?<!eram )(?<!seja )(?<!sejam )(?<!sempre )(?<!fica )(?<!ficam )(?<!continua )(?<!permanece )\\b(?:o|a|os|as|do|da|dos|das|no|na|nos|nas|ao|à|aos|às|pelo|pela|pelos|pelas)\\s+mesm[oa]s?(?=\\s*[.,;:)!?]|\\s*$)"
  motivo: '"O mesmo" como pronome esconde o referente. "O mesmo arquivo" (adjetivo) e "o valor é sempre o mesmo" (igual) são aceitos.'
  exemplo_correto: Abra o arquivo e salve o arquivo.
  exemplo_incorreto: Abra o arquivo e salve o mesmo.
  versao_inclusao: 0.2.0

- id: V-0301
  lema: gerundismo
  classe: padrao
  status: nao_preferido
  preferir: [futuro simples, presente]
  significado_aprovado: —
  padrao: "\\b(?:vou|vai|vamos|vão|irei|irá|iremos|irão)\\s+estar\\s+[a-zà-ÿ]+ndo\\b"
  motivo: '"Pode estar ocorrendo" (probabilidade) não é gerundismo e não é marcado.'
  exemplo_correto: Vamos enviar o arquivo amanhã.
  exemplo_incorreto: Vamos estar enviando o arquivo amanhã.
  versao_inclusao: 0.2.0

