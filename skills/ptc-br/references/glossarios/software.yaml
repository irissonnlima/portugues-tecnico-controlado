# Glossário PTC-BR — Software e desenvolvimento (spec 0.4.0)
#
# Termos aprovados do domínio. Anglicismos consolidados ficam aprovados, sem itálico e com gênero
# registrado: o verificador aponta o gênero oposto (PTC-08). Para trocar uma escolha, use uma camada
# de vocabulário do time. Faixa de ID: V-1000..V-1099.

- id: V-1000
  lema: commit
  classe: substantivo
  status: aprovado
  dominio: software
  genero: m
  significado_aprovado: "registro de um conjunto de alterações no repositório git"
  versao_inclusao: 0.4.0

- id: V-1001
  lema: branch
  classe: substantivo
  status: aprovado
  dominio: software
  genero: f
  significado_aprovado: "linha de desenvolvimento independente no repositório"
  versao_inclusao: 0.4.0

- id: V-1002
  lema: merge
  classe: substantivo
  status: aprovado
  dominio: software
  genero: m
  significado_aprovado: "integração das alterações de uma branch em outra"
  versao_inclusao: 0.4.0

- id: V-1003
  lema: pull request
  classe: substantivo
  status: aprovado
  dominio: software
  genero: m
  significado_aprovado: "pedido de revisão e merge de uma branch"
  versao_inclusao: 0.4.0

- id: V-1004
  lema: deploy
  classe: substantivo
  status: aprovado
  dominio: software
  genero: m
  significado_aprovado: "publicação de uma versão em um ambiente"
  versao_inclusao: 0.4.0

- id: V-1005
  lema: pipeline
  classe: substantivo
  status: aprovado
  dominio: software
  genero: m
  significado_aprovado: "sequência automatizada de etapas de build, teste e deploy"
  versao_inclusao: 0.4.0

- id: V-1006
  lema: build
  classe: substantivo
  status: aprovado
  dominio: software
  genero: m
  significado_aprovado: "artefato gerado a partir do código-fonte, ou o processo que o gera"
  versao_inclusao: 0.4.0

- id: V-1007
  lema: release
  classe: substantivo
  status: aprovado
  dominio: software
  significado_aprovado: "versão publicada de um software"
  motivo: 'Gênero sem registro: "a release" (versão) e "o release" (instalação do Helm) são comuns.'
  versao_inclusao: 0.4.0

- id: V-1008
  lema: tag
  classe: substantivo
  status: aprovado
  dominio: software
  genero: f
  significado_aprovado: "marcador fixo de um commit, em geral uma versão"
